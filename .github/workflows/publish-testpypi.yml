name: Publish to TestPyPI

on:
  push:
    tags:
      - "v*.*.*rc*"
      - "v*.*.*dev*"
      - "v*.*.*a*"
      - "v*.*.*b*"
      - "testpypi-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and check without publishing)"
        type: boolean
        default: false

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution packages with Twine
        run: twine check --strict dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/llm-reliability
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    name: Post-Publish Smoke Test
    needs: [publish-testpypi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package from TestPyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ llm-reliability

      - name: Verify package import and version
        run: |
          python -c "import llm_reliability; print(f'Successfully imported version: {llm_reliability.__version__}')"

      - name: Verify CLI entrypoint
        run: |
          llm-reliability --version

