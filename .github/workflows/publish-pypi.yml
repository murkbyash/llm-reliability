name: Publish to Production PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and check without publishing to PyPI)"
        type: boolean
        default: false

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-publish-checks:
    name: Pre-Publish Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Strict Type Check
        run: mypy src tests

      - name: Run Pytest Test Suite
        run: pytest -v

      - name: Run Benchmark Calibration Check
        run: |
          python -c "from llm_reliability import run_benchmark; r = run_benchmark(samples_per_category=5); assert r.passed and r.overall_accuracy >= 0.95"

  build:
    name: Build Production Distribution Packages
    needs: [pre-publish-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution and binary wheel
        run: python -m build

      - name: Strict Twine Validation
        run: twine check --strict dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: production-package-distributions
          path: dist/
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-reliability
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: production-package-distributions
          path: dist/

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Attach distribution artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  smoke-test:
    name: Post-Publish Production Smoke Test
    needs: [publish-pypi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install llm-reliability

      - name: Verify package import and version
        run: |
          python -c "import llm_reliability; print(f'Successfully imported production release: {llm_reliability.__version__}')"

      - name: Verify CLI entrypoint
        run: |
          llm-reliability --version

