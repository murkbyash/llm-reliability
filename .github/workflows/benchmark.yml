name: Benchmark & Calibration Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-calibration:
    name: 45-Sample Ground Truth Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Benchmark Calibration Suite
        run: |
          python -c "from llm_reliability import run_benchmark; r = run_benchmark(samples_per_category=5); print(f'Accuracy: {r.overall_accuracy*100:.1f}%, F1: {r.macro_f1:.2f}'); assert r.passed, 'Benchmark failed calibration threshold!'"

