name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features & Enhancements"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "⚡ Performance Improvements"
    labels:
      - "performance"
      - "optimization"
  - title: "📚 Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "🛠️ Maintenance & CI/CD"
    labels:
      - "ci"
      - "maintenance"
      - "dependencies"

change-template: "- $TITLE by @$AUTHOR in #$NUMBER"
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
  patch:
    labels:
      - "patch"
      - "fix"
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/murkbyash/llm-reliability/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

